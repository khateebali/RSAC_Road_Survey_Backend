# GNN Road Survey Backend — base config, no secrets here.
# Real values (DB password, JWT secret) go in application-local.properties
# (gitignored — see .gitignore) or environment variables in the actual
# deployment (staging-db:8070). This file only sets structure/defaults.

spring.application.name=gnn-road-survey-backend
server.port=8070

# --- Database (gnn_road_survey, db-primary) ---
# Actual host/credentials supplied via application-local.properties or env vars
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) — never committed here.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gnn_road_survey}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# --- MinIO (gnn-survey-minio, staging-db, ports 9002/9003) ---
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9002}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:gnn-survey-media}

# --- Actuator / Prometheus (Section 7.1) ---
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# --- OpenAPI (Section 7.1 — springdoc) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
